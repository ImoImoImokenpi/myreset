# Render の Blueprint。Render のダッシュボードで「New > Blueprint」からこのリポジトリを選ぶと作成される
services:
  - type: web
    name: myreset
    runtime: docker
    plan: free
    # Neon のデータベースと同じ地域にすると速い（日本から近いのはシンガポール）
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 「ログインしたままにする」の署名鍵。Render が自動で生成する
      - key: REMEMBER_ME_KEY
        generateValue: true
      # 外部の cron サービスから /cron/reminders?key=... を呼ぶときの鍵。Render が自動で生成する
      - key: CRON_KEY
        generateValue: true
      # 以下は作成時に Render の画面で入力する
      # Neon の接続文字列（postgresql://ユーザー:パスワード@ホスト/DB名?sslmode=require）をそのまま貼る
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: REGISTRATION_OPEN
        value: "true"
