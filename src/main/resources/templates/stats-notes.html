<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('振り返り')}"></head>
<body>
<header th:replace="~{fragments :: header('stats')}"></header>

<main>
    <div class="page-head">
        <h1>記録</h1>
        <p>過去の振り返りメモと記録を、習慣や期間で絞り込んで見返せます。</p>
    </div>

    <nav class="tabs" aria-label="記録の表示">
        <a class="tab" th:href="@{/stats}">統計</a>
        <a class="tab active" th:href="@{/stats/notes}" aria-current="page">振り返り</a>
    </nav>

    <!-- 絞り込み -->
    <section class="panel">
        <form class="journal-filter" th:action="@{/stats/notes}" method="get">
            <label class="field">
                <span>習慣</span>
                <select name="habit" onchange="this.form.requestSubmit()">
                    <option value="">すべての習慣</option>
                    <optgroup label="登録中" th:unless="${activeHabits.isEmpty()}">
                        <option th:each="h : ${activeHabits}" th:value="${h.id}" th:text="${h.name}"
                                th:selected="${h.id == selectedHabit}">読書</option>
                    </optgroup>
                    <optgroup label="外した習慣" th:unless="${archivedHabits.isEmpty()}">
                        <option th:each="h : ${archivedHabits}" th:value="${h.id}" th:text="${h.name}"
                                th:selected="${h.id == selectedHabit}">筋トレ</option>
                    </optgroup>
                </select>
            </label>
            <label class="field">
                <span>期間</span>
                <select name="period" onchange="this.form.requestSubmit()">
                    <option th:each="p : ${periods}" th:value="${p.key}" th:text="${p.label}"
                            th:selected="${p == period}">直近30日</option>
                </select>
            </label>
            <label class="checkbox journal-notes-only">
                <input type="checkbox" name="notesOnly" value="true" th:checked="${notesOnly}"
                       onchange="this.form.requestSubmit()">
                <span>メモがある日だけ</span>
            </label>
            <noscript><button type="submit" class="button">絞り込む</button></noscript>
        </form>
    </section>

    <!-- 習慣を選んだときのまとめ -->
    <section class="panel" th:if="${journal.summary}" th:with="s=${journal.summary}">
        <div class="habit-stats-head">
            <span class="item-icon"><svg th:replace="~{icons :: icon(${s.habit.category.icon})}"></svg></span>
            <div class="item-main">
                <p class="item-title">
                    <span th:text="${s.habit.name}">読書</span>
                    <span class="badge subtle" th:unless="${s.habit.active}">外した習慣</span>
                </p>
                <p class="item-sub">
                    <span th:text="${s.habit.scheduleLabel}">毎日</span>
                    <span th:if="${s.habit.quantity}" th:text="| ・ 目標 ${s.habit.targetLabel}|"></span>
                    <span th:if="${s.first}"
                          th:text="| ・ ${#temporals.format(s.first, 'yyyy/M/d')} 〜 ${#temporals.format(s.last, 'yyyy/M/d')}|"></span>
                </p>
            </div>
        </div>
        <dl class="summary">
            <div><dt>記録した日</dt><dd><span th:text="${s.recordedDays}">0</span><small>日</small></dd></div>
            <div><dt>達成した日</dt><dd><span th:text="${s.completedDays}">0</span><small>日</small></dd></div>
            <div th:if="${s.habit.quantity}">
                <dt>合計</dt><dd><span th:text="${s.totalAmount}">0</span><small th:text="${s.habit.unit ?: '回'}">回</small></dd>
            </div>
            <div th:unless="${s.habit.quantity}">
                <dt>メモがある日</dt>
                <dd><span th:text="${#lists.size(journal.entries.?[hasReflection()])}">0</span><small>日</small></dd>
            </div>
        </dl>
    </section>

    <!-- 日ごとの一覧 -->
    <section class="panel">
        <div class="panel-head">
            <h2 th:text="|${period.label}の振り返り|">直近30日の振り返り</h2>
            <span class="count" th:text="${journal.entries.size()}">0</span>
        </div>

        <div class="empty-state" th:if="${journal.entries.isEmpty()}">
            <p th:text="${notesOnly} ? 'この期間に書いたメモはありません' : 'この期間の記録はありません'">記録はありません</p>
            <p class="small" th:if="${period.key != 'all'}">期間を「すべて」にすると、もっと前までさかのぼれます。</p>
        </div>

        <ol class="journal">
            <li th:each="e : ${journal.entries}">
                <p class="journal-date">
                    <time th:datetime="${e.date}" th:text="${#temporals.format(e.date, 'M月d日（E）')}">11月10日（月）</time>
                    <span class="muted small" th:text="${#temporals.format(e.date, 'yyyy')}">2026</span>
                </p>
                <div class="chips" th:unless="${e.marks.isEmpty()}">
                    <span class="chip" th:each="m : ${e.marks}" th:classappend="${m.completed} ? 'on'">
                        <th:block th:if="${m.completed}"><svg th:replace="~{icons :: icon('check')}"></svg></th:block>
                        <span th:text="${selectedHabit != null} ? ${m.amountLabel()}
                                       : (${m.quantity} ? |${m.name} ${m.amount}/${m.target}| : ${m.name})">読書</span>
                    </span>
                </div>
                <p class="journal-text" th:if="${e.hasReflection()}" th:text="${e.reflection}">今日はよく眠れた</p>
                <p class="journal-text muted small" th:unless="${e.hasReflection()}">メモなし</p>
            </li>
        </ol>
    </section>
</main>
</body>
</html>
