<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('新規登録')}"></head>
<body class="auth">
<main class="auth-main">
    <div class="auth-brand">
        <span class="brand-mark brand-mark-lg"><svg th:replace="~{icons :: icon('logo')}"></svg></span>
        <h1>My<b>Reset</b></h1>
        <p>アカウントを作って始めましょう。</p>
    </div>

    <section class="panel" th:unless="${registrationOpen}">
        <p class="alert info">現在、新規登録は受け付けていません。</p>
        <a class="button full" th:href="@{/login}">ログインへ</a>
    </section>

    <section class="panel" th:if="${registrationOpen}">
        <p class="alert info" th:if="${firstUser}">
            最初に登録したユーザーは管理者になり、これまでに記録した習慣と振り返りを引き継ぎます。
        </p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" class="stack">
            <label class="field">
                <span>ユーザー名（半角英数字と _ ）</span>
                <input type="text" th:field="*{username}" autocomplete="username" autocapitalize="none"
                       maxlength="30" required autofocus>
                <small class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
            </label>
            <label class="field">
                <span>パスワード（8文字以上）</span>
                <input type="password" th:field="*{password}" autocomplete="new-password" required>
                <small class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </label>
            <label class="field">
                <span>パスワード（確認）</span>
                <input type="password" th:field="*{passwordConfirm}" autocomplete="new-password" required>
                <small class="error" th:if="${#fields.hasErrors('passwordConfirmed')}"
                       th:errors="*{passwordConfirmed}"></small>
            </label>
            <button type="submit" class="button full">登録して始める</button>
        </form>
    </section>
    <p class="auth-switch">すでにアカウントがある場合は <a th:href="@{/login}">ログイン</a></p>
</main>
</body>
</html>
