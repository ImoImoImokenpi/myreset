<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' | MyReset'">MyReset</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- ユーザーが選んだメインカラー（ThemeColor で #rrggbb 形式だけを許可している） -->
    <style th:inline="css">
        :root { --brand: [(${currentUser != null ? currentUser.themeColor : '#4f46e5'})]; }
    </style>
    <meta name="theme-color" th:content="${currentUser != null ? currentUser.themeColor : '#4f46e5'}">
</head>
<body>
<header th:fragment="header(active)" class="site-header">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark"><svg th:replace="~{icons :: icon('logo')}"></svg></span>
        <span>My<b>Reset</b></span>
    </a>
    <nav class="site-nav" th:if="${currentUser}">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">
            <svg th:replace="~{icons :: icon('home')}"></svg><span class="nav-label">今日</span>
        </a>
        <a th:href="@{/habits}" th:classappend="${active == 'habits'} ? 'active'">
            <svg th:replace="~{icons :: icon('list')}"></svg><span class="nav-label">習慣</span>
        </a>
        <a th:if="${currentUser.admin}" th:href="@{/admin/users}"
           th:classappend="${active == 'admin'} ? 'active'">
            <svg th:replace="~{icons :: icon('users')}"></svg><span class="nav-label">管理</span>
        </a>
        <a th:href="@{/account}" th:classappend="${active == 'account'} ? 'active'">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser.username, 0, 1))}">U</span>
            <span class="nav-label" th:text="${currentUser.username}">アカウント</span>
        </a>
    </nav>
</header>

<p th:fragment="flash" class="toast" th:if="${message}" th:text="${message}" role="status"></p>
</body>
</html>
