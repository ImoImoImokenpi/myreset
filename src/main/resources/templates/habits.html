<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('習慣')}"></head>
<body>
<header th:replace="~{fragments :: header('habits')}"></header>

<main>
    <p th:replace="~{fragments :: flash}"></p>

    <div class="page-head">
        <h1>習慣</h1>
        <p>毎日取り組みたいことを登録しましょう。達成すると XP がもらえます。目のアイコンで、フレンドに見せるかどうかを切り替えられます。</p>
    </div>

    <section class="panel">
        <div class="panel-head"><h2>新しい習慣</h2></div>
        <form th:action="@{/habits}" th:object="${habitForm}" method="post" class="habit-form">
            <label class="field field-name">
                <span>名前</span>
                <input type="text" th:field="*{name}" placeholder="例：腕立て伏せ30回" maxlength="50" required>
                <small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </label>
            <fieldset class="field">
                <legend>カテゴリ</legend>
                <div class="segmented">
                    <label th:each="c : ${categories}">
                        <input type="radio" th:field="*{category}" th:value="${c}">
                        <span><svg th:replace="~{icons :: icon(${c.icon})}"></svg><span th:text="${c.label}"></span></span>
                    </label>
                </div>
            </fieldset>
            <fieldset class="field field-days">
                <legend>実施する曜日</legend>
                <div class="day-picker">
                    <label th:each="w : ${weekdays}">
                        <input type="checkbox" th:field="*{days}" th:value="${w.day}">
                        <span th:text="${w.label}">月</span>
                    </label>
                </div>
                <small class="error" th:if="${#fields.hasErrors('anyDay')}" th:errors="*{anyDay}"></small>
            </fieldset>
            <div class="field field-target">
                <label class="checkbox">
                    <input type="checkbox" th:field="*{useTarget}">
                    <span>回数・時間の目標を決める（例：水を8杯、読書30分）。進めた分だけ XP がもらえます</span>
                </label>
                <div class="target-fields">
                    <label class="field">
                        <span>1日の目標</span>
                        <input type="number" th:field="*{target}" min="1" max="10000" inputmode="numeric">
                    </label>
                    <label class="field">
                        <span>単位</span>
                        <input type="text" th:field="*{unit}" maxlength="10" placeholder="回・杯・分 など">
                    </label>
                    <label class="field">
                        <span>＋ボタン1回で増やす量</span>
                        <input type="number" th:field="*{step}" min="1" max="1000" inputmode="numeric">
                    </label>
                </div>
                <small class="error" th:if="${#fields.hasErrors('target')}" th:errors="*{target}"></small>
                <small class="error" th:if="${#fields.hasErrors('step')}" th:errors="*{step}"></small>
                <small class="error" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></small>
            </div>
            <label class="field field-xp">
                <span>XP</span>
                <input type="number" th:field="*{xp}" min="1" max="100" inputmode="numeric">
                <small class="error" th:if="${#fields.hasErrors('xp')}" th:errors="*{xp}"></small>
            </label>
            <button type="submit" class="button">
                <svg th:replace="~{icons :: icon('plus')}"></svg>追加
            </button>
        </form>
    </section>

    <section class="panel">
        <div class="panel-head">
            <h2>登録中</h2>
            <span class="count" th:text="${habits.size()}">0</span>
        </div>
        <p class="muted" th:if="${habits.isEmpty()}">まだ習慣がありません。</p>
        <ul class="item-list">
            <li th:each="h : ${habits}">
                <span class="item-icon"><svg th:replace="~{icons :: icon(${h.category.icon})}"></svg></span>
                <div class="item-main">
                    <p class="item-title">
                        <span th:text="${h.name}"></span>
                        <span class="badge subtle" th:unless="${h.shared}">非公開</span>
                    </p>
                    <p class="item-sub">
                        <span th:text="|${h.category.label} ・ ${h.xp} XP ・ ${h.scheduleLabel}|"></span>
                        <span th:if="${h.quantity}" th:text="| ・ 目標 ${h.targetLabel}|"></span>
                    </p>
                </div>
                <button type="button" class="icon-button" data-rename-toggle aria-label="名前を変更" title="名前を変更">
                    <svg th:replace="~{icons :: icon('pen')}"></svg>
                </button>
                <form th:action="@{/habits/{id}/share(id=${h.id})}" method="post" data-instant="share">
                    <button type="submit" class="icon-button"
                            th:aria-label="${h.shared} ? 'フレンドに見せない' : 'フレンドに見せる'"
                            th:title="${h.shared} ? 'フレンドに公開中（押すと非公開）' : '非公開（押すとフレンドに公開）'">
                        <th:block th:if="${h.shared}"><svg th:replace="~{icons :: icon('eye')}"></svg></th:block>
                        <th:block th:unless="${h.shared}"><svg th:replace="~{icons :: icon('eye-off')}"></svg></th:block>
                    </button>
                </form>
                <form th:action="@{/habits/{id}/archive(id=${h.id})}" method="post"
                      onsubmit="return confirm('この習慣を一覧から外しますか？（獲得XPは残ります）');">
                    <button type="submit" class="icon-button danger" aria-label="外す">
                        <svg th:replace="~{icons :: icon('trash')}"></svg>
                    </button>
                </form>
                <form class="rename-form" th:action="@{/habits/{id}/rename(id=${h.id})}" method="post">
                    <input type="text" name="name" th:value="${h.name}" maxlength="50" required
                           aria-label="新しい名前">
                    <button type="submit" class="button small">保存</button>
                    <button type="button" class="button small ghost" data-rename-toggle>キャンセル</button>
                </form>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
