<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ログイン')}"></head>
<body class="auth">
<main class="auth-main">
    <div class="auth-brand">
        <span class="brand-mark brand-mark-lg"><svg th:replace="~{icons :: icon('logo')}"></svg></span>
        <h1>My<b>Reset</b></h1>
        <p>毎日の小さな積み重ねで、自分をアップデート。</p>
    </div>

    <section class="panel">
        <p class="alert" th:if="${param.error}">ユーザー名またはパスワードが違います</p>
        <p class="alert info" th:if="${param.logout}">ログアウトしました</p>

        <form th:action="@{/login}" method="post" class="stack">
            <label class="field">
                <span>ユーザー名</span>
                <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
            </label>
            <label class="field">
                <span>パスワード</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <label class="checkbox">
                <input type="checkbox" name="remember-me" checked>
                <span>ログインしたままにする（30日間）</span>
            </label>
            <button type="submit" class="button full">ログイン</button>
        </form>
    </section>
    <p class="auth-switch">アカウントがない場合は <a th:href="@{/register}">新規登録</a></p>
</main>
</body>
</html>
