spring.application.name=olafreset

# データはプロジェクト直下の data/ フォルダに保存される
spring.datasource.url=jdbc:h2:file:./data/olafreset
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# DBの中身をブラウザで確認したいとき: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# 「ログインしたままにする」用の署名鍵。公開するときは環境変数 REMEMBER_ME_KEY で上書きする
app.remember-me-key=${REMEMBER_ME_KEY:-jMvpEF5DZs9rELG4QYvbnS_f-xKhvwrqMxV0sPY2wk}

# CSS の URL にファイル内容のハッシュを付ける（例: /css/app-<hash>.css）。
# 変更すると URL が変わるので、ブラウザに古い CSS が残らない
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Tailscale serve などのプロキシ経由で HTTPS 公開したとき、
# プロキシが付ける X-Forwarded-* ヘッダーを使ってリダイレクト先の URL を正しく組み立てる
# （信頼するのはローカルホストからのプロキシだけ）
server.forward-headers-strategy=native
