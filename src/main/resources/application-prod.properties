# 本番（Render + Neon）用の設定。SPRING_PROFILES_ACTIVE=prod で有効になる。
# 接続情報やキーはすべて環境変数で渡し、ここには書かない。

# Render は待ち受けポートを PORT で指定する
server.port=${PORT:8080}

# Neon の PostgreSQL
# 例: DATABASE_URL=jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# 無料枠のメモリと接続数に合わせて小さくする
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# 本番では DB の中身をブラウザから見られないようにする
spring.h2.console.enabled=false

# 本番では必ず環境変数で設定する（初期値なし）
app.remember-me-key=${REMEMBER_ME_KEY}

# このユーザー名で登録した人だけが管理者になる
app.admin-username=${ADMIN_USERNAME:}
# 自分のアカウントを作ったら false にすると、他の人は登録できなくなる
app.registration-open=${REGISTRATION_OPEN:true}

# Render の HTTPS 終端（プロキシ）の後ろで動くので、転送ヘッダーを使う
server.forward-headers-strategy=framework
